<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TowerShare — Chat Simulator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone {
    width: 375px;
    height: 720px;
    background: #000;
    border-radius: 48px;
    border: 3px solid #333;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  }

  .status-bar {
    background: #1c1c1e;
    color: #fff;
    font-size: 12px;
    padding: 12px 24px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .header {
    background: #1c1c1e;
    color: #fff;
    padding: 10px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #2c2c2e;
    flex-shrink: 0;
  }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00b4d8, #0077b6);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .header-info { flex: 1; }
  .header-name { font-size: 15px; font-weight: 600; }
  .header-sub  { font-size: 11px; color: #8e8e93; }

  .channel-selector {
    background: #1c1c1e;
    padding: 6px 16px 10px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .channel-btn {
    border: 1px solid #3a3a3c;
    background: transparent;
    color: #8e8e93;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .channel-btn.active {
    background: #0a84ff;
    border-color: #0a84ff;
    color: #fff;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 0;
    background: #000;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .messages::-webkit-scrollbar { width: 0; }

  .bubble-row {
    display: flex;
    flex-direction: column;
  }
  .bubble-row.sent   { align-items: flex-end; }
  .bubble-row.received { align-items: flex-start; }

  .bubble {
    max-width: 72%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .sent .bubble {
    background: #0a84ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .received .bubble {
    background: #1c1c1e;
    color: #fff;
    border-bottom-left-radius: 4px;
  }

  .bubble-meta {
    font-size: 10px;
    color: #636366;
    margin-top: 2px;
    padding: 0 4px;
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    background: #1c1c1e;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #636366;
    animation: bounce .8s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30%         { transform: translateY(-4px); }
  }

  .compose {
    background: #1c1c1e;
    padding: 10px 12px 24px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    border-top: 1px solid #2c2c2e;
    flex-shrink: 0;
  }

  .compose input {
    flex: 1;
    background: #2c2c2e;
    border: none;
    border-radius: 20px;
    padding: 9px 14px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .compose input::placeholder { color: #636366; }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #0a84ff;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .send-btn svg { fill: #fff; }

  .from-label {
    font-size: 10px;
    color: #636366;
    padding: 0 4px;
    margin-bottom: 1px;
  }

  .config-bar {
    background: #1c1c1e;
    padding: 6px 16px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #2c2c2e;
    flex-shrink: 0;
  }
  .config-bar label { font-size: 11px; color: #636366; white-space: nowrap; }
  .config-bar input {
    flex: 1;
    background: #2c2c2e;
    border: none;
    border-radius: 8px;
    padding: 4px 8px;
    color: #fff;
    font-size: 11px;
    outline: none;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●</span>
  </div>

  <div class="header">
    <div class="avatar">🏢</div>
    <div class="header-info">
      <div class="header-name">TowerShare Bot</div>
      <div class="header-sub" id="channel-label">WhatsApp</div>
    </div>
  </div>

  <div class="config-bar">
    <label>API</label>
    <input id="api-url" value="http://localhost:8090/api/towershare/message" />
  </div>

  <div class="channel-selector">
    <button class="channel-btn active" onclick="setChannel('whatsapp', this)">WhatsApp</button>
    <button class="channel-btn" onclick="setChannel('imessage', this)">iMessage</button>
    <button class="channel-btn" onclick="setChannel('sms', this)">SMS</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="compose">
    <input id="input" type="text" placeholder="Message" autocomplete="off"
           onkeydown="if(event.key==='Enter')send()" />
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  let channel = 'whatsapp';
  let fromNumber = '+61400000001';

  function setChannel(ch, btn) {
    channel = ch;
    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('channel-label').textContent =
      ch === 'whatsapp' ? 'WhatsApp' : ch === 'imessage' ? 'iMessage' : 'SMS';
  }

  function now() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function appendBubble(text, side, sender) {
    const messages = document.getElementById('messages');

    const row = document.createElement('div');
    row.className = `bubble-row ${side}`;

    if (sender) {
      const label = document.createElement('div');
      label.className = 'from-label';
      label.textContent = sender;
      row.appendChild(label);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    meta.textContent = now();
    row.appendChild(meta);

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function showTyping() {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'bubble-row received';
    row.id = 'typing-indicator';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function send() {
    const input = document.getElementById('input');
    const btn   = document.getElementById('send-btn');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    btn.disabled = true;

    appendBubble(text, 'sent');
    showTyping();

    const apiUrl = document.getElementById('api-url').value.trim();

    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: fromNumber, body: text, channel }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.text();
        appendBubble(`Error ${res.status}: ${err}`, 'received', 'Bot');
      } else {
        const data = await res.json();
        appendBubble(data.reply ?? JSON.stringify(data), 'received', 'Bot');
      }
    } catch (err) {
      removeTyping();
      appendBubble(
        `Could not reach ${apiUrl}\n\nMake sure PocketBase is running:\n  make dev-backend`,
        'received', 'Bot'
      );
    }

    btn.disabled = false;
    input.focus();
  }

  // Welcome message
  window.onload = () => {
    appendBubble('Hi! I\'m the TowerShare Bot.\n\nSend help to see what I can do.', 'received', 'Bot');
    document.getElementById('input').focus();
  };
</script>
</body>
</html>
