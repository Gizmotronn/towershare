name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pocketbase

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Build & static analysis ─────────────────────────────────────────────
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # ── 2. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

  # ── 3. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Go tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test -v -race -count=1 ./...

  # ── 4. Migration smoke test ────────────────────────────────────────────────
  migrations:
    name: Migration smoke test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build binary
        run: go build -o pocketbase_ci ./main.go

      - name: Start PocketBase
        run: |
          mkdir -p /tmp/pb_ci
          ./pocketbase_ci serve \
            --http=127.0.0.1:8090 \
            --dir=/tmp/pb_ci &
          echo "PB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/api/health > /dev/null; then
              echo "PocketBase is healthy"; exit 0
            fi
            sleep 1
          done
          echo "PocketBase failed to start" && exit 1

      - name: Create admin account
        run: |
          ./pocketbase_ci admin create ci@towershare.local ci-password-123 \
            --dir=/tmp/pb_ci

      - name: Verify collections exist
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8090/api/admins/auth-with-password \
            -H "Content-Type: application/json" \
            -d '{"identity":"ci@towershare.local","password":"ci-password-123"}' \
            | jq -r '.token')

          NAMES=$(curl -sf "http://127.0.0.1:8090/api/collections?perPage=50" \
            -H "Authorization: $TOKEN" \
            | jq -r '[.items[].name] | join(" ")')

          echo "Collections: $NAMES"
          MISSING=0
          for col in users towers apartments listings; do
            if echo "$NAMES" | grep -qw "$col"; then echo "  ✓ $col"
            else echo "  ✗ $col — MISSING"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify key fields
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8090/api/admins/auth-with-password \
            -H "Content-Type: application/json" \
            -d '{"identity":"ci@towershare.local","password":"ci-password-123"}' \
            | jq -r '.token')

          check_field() {
            local col=$1 field=$2
            local fields
            fields=$(curl -sf "http://127.0.0.1:8090/api/collections/$col" \
              -H "Authorization: $TOKEN" \
              | jq -r '[.schema[].name] | join(" ")')
            if echo "$fields" | grep -qw "$field"; then echo "  ✓ $col.$field"
            else echo "  ✗ $col.$field — MISSING"; return 1; fi
          }

          FAIL=0
          check_field towers     name         || FAIL=1
          check_field towers     address      || FAIL=1
          check_field towers     managers     || FAIL=1
          check_field apartments unit_number  || FAIL=1
          check_field apartments tower        || FAIL=1
          check_field listings   title        || FAIL=1
          check_field listings   category     || FAIL=1
          check_field listings   status       || FAIL=1
          check_field listings   owner        || FAIL=1
          check_field users      display_name || FAIL=1
          check_field users      apartment    || FAIL=1
          exit $FAIL

      - name: Stop PocketBase
        if: always()
        run: kill "$PB_PID" 2>/dev/null || true

  # ── 5. Frontend build & lint ───────────────────────────────────────────────
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.yarn/cache
            frontend/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: yarn lint
        working-directory: frontend

      - name: Build
        run: yarn build
        working-directory: frontend

  # ── 6. Docker build & push to GHCR ────────────────────────────────────────
  #
  # PRs: build only (no push) — verifies the image still compiles.
  # Push to main/master: build + tag + push to ghcr.io.
  #
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [build, lint, test, migrations, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build (and push on main/master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

