<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TowerShare</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;
  --text:#f0f0f0;--muted:#707070;--accent:#00b4d8;--accent2:#0077b6;
  --green:#34c759;--orange:#ff9500;--red:#ff3b30;--radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:14px;border:none;border-radius:8px;padding:10px 18px;transition:opacity .15s}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){opacity:.85}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.ghost:hover:not(:disabled){background:rgba(0,180,216,.08)}
button.danger{background:var(--red);color:#fff}
input,textarea,select{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--text);font-family:inherit;font-size:15px;outline:none;
  transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--surface2)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field{margin-bottom:18px}
.err{color:var(--red);font-size:13px;margin-top:6px}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative}

/* Nav */
#nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
#nav .logo{font-size:18px;font-weight:700;color:var(--accent);flex:1}
#nav .user-name{font-size:13px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav button{padding:6px 14px;font-size:13px}

/* Views */
.view{flex:1;overflow-y:auto;padding:20px}
.view::-webkit-scrollbar{width:0}

/* Auth */
#view-auth{display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo h1{font-size:28px;font-weight:800;color:var(--accent)}
.auth-logo p{color:var(--muted);margin-top:6px;font-size:14px}
.tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:24px;gap:4px}
.tab{flex:1;padding:8px;border-radius:7px;background:transparent;color:var(--muted);font-weight:500}
.tab.active{background:var(--surface2);color:var(--text)}
.auth-form{display:none}
.auth-form.active{display:block}

/* Feed */
#view-feed{}
.feed-header{display:flex;align-items:center;margin-bottom:16px;gap:10px}
.feed-header h2{flex:1;font-size:17px;font-weight:700}
.filter-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{height:0}
.chip{
  flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:13px;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.listings-grid{display:flex;flex-direction:column;gap:12px}
.listing-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:border-color .15s;
}
.listing-card:hover{border-color:var(--accent)}
.card-img{width:100%;height:180px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:32px}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:14px}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.badge-lend{background:rgba(0,180,216,.15);color:var(--accent)}
.badge-give{background:rgba(52,199,89,.15);color:var(--green)}
.badge-request{background:rgba(255,149,0,.15);color:var(--orange)}
.card-title{font-weight:600;font-size:15px;margin-bottom:4px}
.card-tower{font-size:13px;color:var(--muted)}
.card-time{font-size:12px;color:var(--muted);margin-left:auto}
.empty{text-align:center;padding:48px 0;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:12px}

/* FAB */
#fab{
  position:absolute;bottom:24px;right:24px;
  width:52px;height:52px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:24px;line-height:1;
  box-shadow:0 4px 20px rgba(0,180,216,.4);
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
#fab:hover{opacity:.9}

/* New listing */
#view-new{}
.view-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.view-header h2{flex:1;font-size:18px;font-weight:700}
.back-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;font-size:13px}
.image-upload-area{
  border:2px dashed var(--border);border-radius:var(--radius);padding:32px;
  text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:18px;
}
.image-upload-area:hover,.image-upload-area.drag{border-color:var(--accent)}
.image-upload-area .icon{font-size:32px;margin-bottom:8px}
.image-upload-area p{color:var(--muted);font-size:14px}
.image-upload-area input{display:none}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2)}
.preview-item img{width:100%;height:100%;object-fit:cover}
.preview-item .remove{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:20px;text-align:center;
  cursor:pointer;
}

/* Toast */
#toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px 20px;font-size:14px;z-index:100;transition:transform .25s;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--red);color:var(--red)}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <!-- Nav -->
  <nav id="nav" style="display:none">
    <span class="logo">TowerShare</span>
    <span class="user-name" id="nav-user"></span>
    <button class="ghost" onclick="showView('feed')">Feed</button>
    <button class="danger" style="padding:6px 12px;font-size:13px" onclick="logout()">Out</button>
  </nav>

  <!-- Auth -->
  <div id="view-auth" class="view" style="display:none">
    <div class="auth-logo">
      <h1>🏢 TowerShare</h1>
      <p>Share resources with your building</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form class="auth-form active" id="form-login" onsubmit="doLogin(event)">
      <div class="field"><label>Email</label><input id="l-email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="l-password" type="password" placeholder="Password" required autocomplete="current-password"></div>
      <div class="err" id="login-err"></div>
      <button type="submit" class="primary" style="width:100%;margin-top:8px" id="login-btn">Sign In</button>
    </form>

    <form class="auth-form" id="form-signup" onsubmit="doSignup(event)">
      <div class="field"><label>Display name</label><input id="s-name" type="text" placeholder="Your name" required></div>
      <div class="field"><label>Email</label><input id="s-email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="s-password" type="password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password"></div>
      <div class="err" id="signup-err"></div>
      <button type="submit" class="primary" style="width:100%;margin-top:8px" id="signup-btn">Create Account</button>
    </form>
  </div>

  <!-- Feed -->
  <div id="view-feed" class="view" style="display:none">
    <div class="feed-header">
      <h2>Listings</h2>
    </div>
    <div class="filter-row">
      <span class="chip active" data-filter="" onclick="setFilter(this,'')">All</span>
      <span class="chip" data-filter="lend" onclick="setFilter(this,'lend')">Lend</span>
      <span class="chip" data-filter="give" onclick="setFilter(this,'give')">Give</span>
      <span class="chip" data-filter="request" onclick="setFilter(this,'request')">Request</span>
    </div>
    <div class="listings-grid" id="listings"></div>
  </div>

  <!-- New listing -->
  <div id="view-new" class="view" style="display:none">
    <div class="view-header">
      <button class="back-btn" onclick="showView('feed')">← Back</button>
      <h2>New Listing</h2>
    </div>
    <div class="image-upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      <div class="icon">📷</div>
      <p>Tap to add photos (up to 5)</p>
      <input type="file" id="file-input" accept="image/*" multiple onchange="onFileChange(event)">
    </div>
    <div class="preview-grid" id="preview-grid"></div>
    <form id="form-new" onsubmit="doCreateListing(event)">
      <div class="field"><label>Title</label><input id="n-title" type="text" placeholder="What are you sharing?" required maxlength="200"></div>
      <div class="field"><label>Description</label><textarea id="n-desc" placeholder="Details, condition, availability..."></textarea></div>
      <div class="field">
        <label>Category</label>
        <select id="n-category" required>
          <option value="">Select...</option>
          <option value="lend">Lend — borrow and return</option>
          <option value="give">Give — free to keep</option>
          <option value="request">Request — looking for something</option>
        </select>
      </div>
      <div class="field">
        <label>Tower</label>
        <select id="n-tower" required><option value="">Loading towers...</option></select>
      </div>
      <div class="err" id="new-err"></div>
      <button type="submit" class="primary" style="width:100%;margin-top:4px" id="new-btn">Post Listing</button>
    </form>
  </div>

  <!-- FAB: only visible on feed view -->
  <button id="fab" onclick="showView('new')" style="display:none" title="New listing">+</button>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const auth = {
  token: localStorage.getItem('pb_token'),
  user:  JSON.parse(localStorage.getItem('pb_user') || 'null'),
  save(token, user) {
    this.token = token; this.user = user;
    localStorage.setItem('pb_token', token);
    localStorage.setItem('pb_user', JSON.stringify(user));
  },
  clear() {
    this.token = null; this.user = null;
    localStorage.removeItem('pb_token');
    localStorage.removeItem('pb_user');
  },
};

let selectedFiles = [];
let activeFilter  = '';

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body, isForm) {
  const headers = {};
  if (auth.token) headers['Authorization'] = auth.token;
  if (!isForm && body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {
    method,
    headers,
    body: isForm ? body : (body ? JSON.stringify(body) : undefined),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || JSON.stringify(data));
  return data;
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}

// ── Auth ───────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((b,i) =>
    b.classList.toggle('active', (i===0) === (tab==='login')));
  document.getElementById('form-login').classList.toggle('active', tab==='login');
  document.getElementById('form-signup').classList.toggle('active', tab==='signup');
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';
  try {
    const data = await api('POST', '/api/collections/users/auth-with-password', {
      identity: document.getElementById('l-email').value,
      password: document.getElementById('l-password').value,
    });
    auth.save(data.token, data.record);
    afterLogin();
  } catch(ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function doSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('signup-btn');
  const err = document.getElementById('signup-err');
  err.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Creating account…';
  const password = document.getElementById('s-password').value;
  try {
    await api('POST', '/api/collections/users/records', {
      email:           document.getElementById('s-email').value,
      password,
      passwordConfirm: password,
      display_name:    document.getElementById('s-name').value,
    });
    // Auto-login after signup
    const data = await api('POST', '/api/collections/users/auth-with-password', {
      identity: document.getElementById('s-email').value,
      password,
    });
    auth.save(data.token, data.record);
    toast('Account created!');
    afterLogin();
  } catch(ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}

function logout() {
  auth.clear();
  document.getElementById('nav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  showView('auth');
}

function afterLogin() {
  const nav = document.getElementById('nav');
  nav.style.display = 'flex';
  document.getElementById('nav-user').textContent =
    auth.user?.display_name || auth.user?.email || '';
  showView('feed');
}

// ── Views ──────────────────────────────────────────────────────────────────
function showView(name) {
  ['auth','feed','new'].forEach(v => {
    document.getElementById('view-' + v).style.display = 'none';
  });
  document.getElementById('view-' + name).style.display = (name === 'auth') ? 'flex' : 'block';
  document.getElementById('fab').style.display = (name === 'feed') ? 'flex' : 'none';
  if (name === 'feed')   loadListings();
  if (name === 'new')    loadTowers();
}

// ── Feed ───────────────────────────────────────────────────────────────────
function setFilter(chip, val) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = val;
  loadListings();
}

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60)   return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function fileUrl(collectionId, recordId, filename, thumb) {
  let u = `/api/files/${collectionId}/${recordId}/${filename}`;
  if (thumb) u += `?thumb=${thumb}`;
  return u;
}

async function loadListings() {
  const el = document.getElementById('listings');
  el.innerHTML = '<div class="empty"><div class="icon">⏳</div><p>Loading…</p></div>';
  try {
    let filter = "status='active'";
    if (activeFilter) filter += ` && category='${activeFilter}'`;
    const data = await api('GET',
      `/api/collections/listings/records?sort=-created&perPage=50&expand=owner,tower&filter=${encodeURIComponent(filter)}`);
    if (!data.items?.length) {
      el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No listings yet.<br>Be the first to share something!</p></div>';
      return;
    }
    el.innerHTML = data.items.map(item => {
      const img = item.images?.[0]
        ? `<div class="card-img"><img src="${fileUrl(item.collectionId, item.id, item.images[0], '600x0')}" loading="lazy"></div>`
        : `<div class="card-img">📦</div>`;
      const tower = item.expand?.tower?.name || '—';
      const owner = item.expand?.owner?.display_name || item.expand?.owner?.email || '—';
      return `<div class="listing-card">
        ${img}
        <div class="card-body">
          <div class="card-meta">
            <span class="badge badge-${item.category}">${item.category}</span>
            <span class="card-tower">🏢 ${tower}</span>
            <span class="card-time">${timeAgo(item.created)}</span>
          </div>
          <div class="card-title">${item.title}</div>
          ${item.description ? `<div class="card-tower" style="margin-top:4px">${item.description}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(ex) {
    el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${ex.message}</p></div>`;
  }
}

// ── New listing ────────────────────────────────────────────────────────────
async function loadTowers() {
  const sel = document.getElementById('n-tower');
  try {
    const data = await api('GET', '/api/collections/towers/records?sort=name&perPage=200');
    if (!data.items?.length) {
      sel.innerHTML = '<option value="">No towers yet — create one in Admin UI</option>';
      return;
    }
    sel.innerHTML = data.items.map(t =>
      `<option value="${t.id}">${t.name}</option>`).join('');
  } catch(ex) {
    sel.innerHTML = `<option value="">Failed to load towers</option>`;
  }
}

function renderPreviews() {
  const grid = document.getElementById('preview-grid');
  grid.innerHTML = selectedFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="preview-item">
      <img src="${url}">
      <div class="remove" onclick="removeFile(${i})">×</div>
    </div>`;
  }).join('');
  document.getElementById('drop-zone').style.display =
    selectedFiles.length >= 5 ? 'none' : 'flex';
}

function removeFile(i) {
  selectedFiles.splice(i, 1);
  renderPreviews();
}

function onFileChange(e) {
  const added = Array.from(e.target.files).slice(0, 5 - selectedFiles.length);
  selectedFiles = [...selectedFiles, ...added];
  renderPreviews();
  e.target.value = '';
}

function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag'); }
function onDragLeave() { document.getElementById('drop-zone').classList.remove('drag'); }
function onDrop(e) {
  e.preventDefault();
  onDragLeave();
  const added = Array.from(e.dataTransfer.files)
    .filter(f => f.type.startsWith('image/'))
    .slice(0, 5 - selectedFiles.length);
  selectedFiles = [...selectedFiles, ...added];
  renderPreviews();
}

async function doCreateListing(e) {
  e.preventDefault();
  const btn = document.getElementById('new-btn');
  const err = document.getElementById('new-err');
  err.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Posting…';

  try {
    const form = new FormData();
    form.append('title',       document.getElementById('n-title').value);
    form.append('description', document.getElementById('n-desc').value);
    form.append('category',    document.getElementById('n-category').value);
    form.append('status',      'active');
    form.append('owner',       auth.user.id);
    form.append('tower',       document.getElementById('n-tower').value);
    selectedFiles.forEach(f => form.append('images', f));

    await api('POST', '/api/collections/listings/records', form, true);
    toast('Listing posted!');
    selectedFiles = [];
    document.getElementById('form-new').reset();
    renderPreviews();
    showView('feed');
  } catch(ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Post Listing';
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
if (auth.token && auth.user) {
  afterLogin();
} else {
  showView('auth');
}
</script>
</body>
</html>
